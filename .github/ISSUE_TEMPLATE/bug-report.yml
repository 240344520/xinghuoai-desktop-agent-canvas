name: Bug 反馈
description: 报告薪火 AI 桌面版中可以稳定复现的问题
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请不要提交 API Key、Token、个人媒体、聊天内容或其他敏感信息。
  - type: input
    id: version
    attributes:
      label: 应用版本
      description: 例如 2.0.7，可在应用“关于”或 Release 页查看。
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Mac 芯片类型
      options:
        - Apple Silicon（M 系列）
        - Intel
        - 不确定
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS 版本
      placeholder: 例如 macOS 15.5
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 请从打开应用开始，按顺序描述操作。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与脱敏日志
      description: 可附截图或脱敏日志；请删除密钥、Token、个人资料和私有媒体。
    validations:
      required: true
